name: multi platform test

on:
  push:
    branches: [ "trunk", "develop" ]
  pull_request:
    branches: [ "trunk" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: windows-latest
            cpp_compiler: cl
          - os: ubuntu-latest
            cpp_compiler: g++
          - os: macos-latest
            cpp_compiler: clang++

    steps:
    - uses: actions/checkout@v4
      with:
        path: main

    - name: Install dependencies Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: >
        sudo apt-get update && sudo apt-get install libboost-dev mrc

    - name: Install Boost Windows
      if: matrix.os == 'windows-latest'
      uses: MarkusJx/install-boost@v2.5.1
      id: install-boost
      with:
          boost_version: 1.82.0

    - name: Install ZLib Window
      if: matrix.os == 'windows-latest'
      run: ${{github.workspace}}/main/tools/depends.cmd
      shell: cmd

    - name: Install Boost macOS
      if: matrix.os == 'macos-latest'
      run: >
        brew install boost fast_float

    - name: Checkout libcifpp
      uses: actions/checkout@v4
      with:
        repository: pdb-redo/libcifpp
        path: libcifpp

    - name: Build libcifpp
      run: |
        cmake -B ${{github.workspace}}/libcifpp/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -S ${{github.workspace}}/libcifpp -DBUILD_DOCUMENTATION=OFF -DBUILD_TESTING=OFF
        cmake --build ${{github.workspace}}/libcifpp/build

    - name: Install libcifpp
      if: matrix.os != 'windows-latest'
      run: sudo cmake --install ${{github.workspace}}/libcifpp/build

    - name: Install libcifpp (Windows)
      if: matrix.os == 'windows-latest'
      run: cmake --install ${{github.workspace}}/libcifpp/build

    - name: Configure CMake
      env:
        BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
      run: >
        cmake -B ${{github.workspace}}/main/build
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -S ${{ github.workspace }}/main
        
    - name: Build
      run: cmake --build ${{github.workspace}}/main/build --config ${{env.BUILD_TYPE}}
      
    - name: Test
      working-directory: ${{github.workspace}}/main/build
      run: ctest --build-config ${{env.BUILD_TYPE}} --output-on-failure

    - name: Install
      if: matrix.os != 'windows-latest'
      run: sudo cmake --install ${{github.workspace}}/main/build --config ${{env.BUILD_TYPE}}
